name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.1.7)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Release Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            echo "RELEASE_VERSION=$VER" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"
            echo "RELEASE_VERSION=$VER" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
          else
            GRADLE_VER=$(grep "versionName" frontend/android/app/build.gradle | head -n 1 | awk -F '"' '{print $2}')
            if [ -n "$GRADLE_VER" ]; then
              VER="v${GRADLE_VER}"
            else
              VER="v1.1.${{ github.run_number }}"
            fi
            echo "RELEASE_VERSION=$VER" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi
          echo "Target Release Version: $VER"

      - name: Build Web Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Auto-Publish to CStore (Chunked Upload)
        run: |
          APK_FILE=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            node frontend/scripts/cstore-publish.mjs \
              --apk "$APK_FILE" \
              --name "C STORE" \
              --version "${{ steps.version_step.outputs.RELEASE_VERSION }}" \
              --supabaseUrl "https://cvbjoexzfwesgiapdcve.supabase.co" \
              --token "${{ secrets.CSTORE_DEPLOY_TOKEN }}"
          else
            echo "No APK found to publish."
          fi
        env:
          CSTORE_DEPLOY_TOKEN: ${{ secrets.CSTORE_DEPLOY_TOKEN }}

      - name: Create GitHub Release
        if: steps.version_step.outputs.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/release/*.apk
          name: CStore Release ${{ steps.version_step.outputs.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
